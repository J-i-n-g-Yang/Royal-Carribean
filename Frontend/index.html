<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Royal Caribbean Cruise Tools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f8f9fb;color:#222}
.app{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:15px;margin-bottom:15px}
button{cursor:pointer;padding:8px 12px;border-radius:6px;border:none;background:#1a56b0;color:white}
input,select{padding:8px;border:1px solid #ccc;border-radius:6px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1}
.link-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
</style>
</head>

<body>
<div class="app">

<h2>🚢 Cruise Tools Dashboard</h2>

<div class="card">
  <h4>Offer Code Lookup</h4>
  <div class="row">
    <div class="field">
      <input id="lookupCode" placeholder="e.g. 2601CHN03">
    </div>
    <button onclick="doLookup()">Lookup</button>
  </div>

  <div id="lookupResult" style="display:none;margin-top:10px;">
    <div id="lookupFilename"></div>
    <div id="lookupUrl" style="font-size:12px;color:gray"></div>
  </div>
</div>

<div class="card">
  <h4>Generate Links</h4>
  <div class="row">
    <div class="field">
      <label>Year</label>
      <input id="genYear" type="number" value="2026">
    </div>
    <div class="field">
      <label>Month</label>
      <select id="genMonth">
        <option value="1">Jan</option>
        <option value="2">Feb</option>
        <option value="3">Mar</option>
        <option value="4">Apr</option>
        <option value="5">May</option>
        <option value="6">Jun</option>
        <option value="7">Jul</option>
        <option value="8">Aug</option>
        <option value="9">Sep</option>
        <option value="10">Oct</option>
        <option value="11">Nov</option>
        <option value="12">Dec</option>
      </select>
    </div>
  </div>

  <br>
  <button onclick="generateLinks()">Generate</button>

  <div id="linksResult" style="margin-top:15px;display:none;">
    <h4 id="linksCaption"></h4>

    <div class="card">
      <h5>China (CHN)</h5>
      <div id="chnLinks"></div>
    </div>

    <div class="card">
      <h5>Singapore (S)</h5>
      <div id="sLinks"></div>
    </div>
  </div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
